name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


permissions:
  contents: read


jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Installing Node 
        uses: actions/setup-node@v3
        with: 
          node-version: '22'

      - name: Running API tests
        working-directory: ./api
        run: | 
          npm install 
          npm test

